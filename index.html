<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Projects Multiverse</title>
  <meta name="description" content="An interactive 3D map of interconnected projects around Planetary Council.">
  <meta name="theme-color" content="#020805">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=9">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- Desktop: 3D -->
  <div id="stage" hidden>
    <div id="gl"></div>
    <div id="labels" aria-hidden="true"></div>

    <header class="brand">
      <div class="brand-name">MARS ROBERTSON</div>
      <div class="brand-sub">projects multiverse</div>
    </header>
    <nav class="corner">
      <button id="btn-reset" type="button" title="Reset view (Esc)">reset</button>
      <a href="?view=list">list</a>
    </nav>

    <aside id="panel" class="panel" hidden>
      <button class="panel-close" type="button" aria-label="Close">×</button>
      <div class="panel-kicker"><i class="st-dot"></i><span class="panel-status"></span></div>
      <h2 class="panel-name"></h2>
      <p class="panel-tagline"></p>
      <div class="panel-links"></div>
      <a class="panel-visit" target="_blank" rel="noopener">Enter ↗</a>
    </aside>

    <!-- Editor: press E, or Alt+drag a project. For arranging the map, not for visitors. -->
    <section id="editor" class="editor" hidden>
      <div class="ed-bar">
        <button type="button" data-tool="move" title="Drag a project to move it. Scroll over it to resize.">move · size</button>
        <button type="button" data-tool="parent" title="Drag from the parent to the child (single line). Again to remove.">parent → child</button>
        <button type="button" data-tool="sibling" title="Drag from one project to another (double line). Again to remove.">sibling</button>
        <button type="button" data-tool="shape" title="Click a project: cube or pyramid (standalone, self-sufficient).">cube / pyramid</button>
        <span></span>
        <button class="ed-copy" type="button">copy</button>
        <button class="ed-discard" type="button">discard</button>
        <button class="ed-close" type="button" aria-label="Hide editor (E)">×</button>
      </div>
      <p class="ed-help">Drag projects · scroll over one to resize · drag a line again to remove it · pyramid = standalone · Alt works without the editor · copy and paste to Claude</p>
      <textarea spellcheck="false" readonly></textarea>
    </section>
  </div>

  <!-- Mobile: list -->
  <div id="list" hidden>
    <header class="m-head">
      <div class="brand-name">MARS ROBERTSON</div>
      <div class="brand-sub">projects multiverse</div>
      <nav class="corner"><a href="?view=3d">3d map</a></nav>
    </header>
    <nav id="m-nav" class="m-nav" aria-label="Jump to project"></nav>
    <main id="m-cards" class="m-cards"></main>
  </div>

  <noscript><p style="color:#7f7;padding:2rem;font-family:monospace">This map needs JavaScript.</p></noscript>
  <script type="module" src="js/main.js?v=9"></script>
</body>
</html>
